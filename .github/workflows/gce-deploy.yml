name: Deploy application to GCE

on:
  workflow_call:
    inputs:
      deploy_mode:
        description: compose、scheduled-container または package-update を指定します。
        required: true
        type: string
      checkout_submodules:
        description: サブモジュールを再帰的にチェックアウトします。
        required: false
        type: boolean
        default: false
      enforce_deploy_team:
        description: 実行者のチーム所属を必須にします。PR 作成者は同じチームのメンバーまたは dependabot[bot] を許可します。
        required: false
        type: boolean
        default: true
      deploy_team_slug:
        description: デプロイの実行を許可する Organization チームです。所属確認が有効な場合に使用します。
        required: false
        type: string
        default: deg-develop
      environment_name:
        description: 実際のデプロイジョブで使用するデプロイ環境です。
        required: true
        type: string
      app_env_secret:
        description: 値を APP_ENV として 設定ファイルの生成に使用する、呼び出し元の Secret 名（任意）です。
        required: false
        type: string
        default: ''
      discord_webhook_secret:
        description: 値を DISCORD_WEBHOOK_URL として 設定ファイルの生成に使用する、呼び出し元の Secret 名（任意）です。
        required: false
        type: string
        default: ''
      addresses_secret:
        description: 値を ADDRESSES_TXT として 設定ファイルの生成に使用する、呼び出し元の Secret 名（任意）です。
        required: false
        type: string
        default: ''
      notification_suppression_seconds:
        description: 設定ファイルの生成に使用する値（任意）です。
        required: false
        type: string
        default: '3600'

jobs:
  deploy:
    # Caller workflows decide which labels are accepted for each repository.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       (github.event.label.name == 'dev' || github.event.label.name == 'stg' ||
        github.event.label.name == 'prd'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment_name }}
      DEPLOY_MODE: ${{ inputs.deploy_mode }}
      CALLER_REPOSITORY: ${{ github.repository }}
      # Environment-specific values use the DEV_*, STG_*, and PRD_* secret
      # prefixes. PROD_* remains a compatibility fallback for existing callers.
      GCE_INSTANCE_NAME: >-
        ${{
          secrets[format(
            '{0}_GCE_INSTANCE_NAME',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCE_INSTANCE_NAME || '')
        }}
      GCE_ZONE: >-
        ${{
          secrets[format(
            '{0}_GCE_ZONE',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] || secrets.GCE_ZONE ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCE_ZONE || '')
        }}
      GCP_SA_EMAIL: >-
        ${{
          secrets[format(
            '{0}_GCP_SA_EMAIL',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCP_SA_EMAIL || '')
        }}
      GCP_WIF_PROVIDER: >-
        ${{
          secrets[format(
            '{0}_GCP_WIF_PROVIDER',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCP_WIF_PROVIDER || '')
        }}
      APP_ENV: ${{ inputs.app_env_secret != '' && secrets[inputs.app_env_secret] || '' }}
      DISCORD_WEBHOOK_URL: ${{ inputs.discord_webhook_secret != '' && secrets[inputs.discord_webhook_secret] || '' }}
      ADDRESSES_TXT: ${{ inputs.addresses_secret != '' && secrets[inputs.addresses_secret] || '' }}
      DEPLOY_APP_ID: ${{ secrets.ORG_GH_APP_ID }}
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.ORG_GH_APP_PRIVATE_KEY }}
      NOTIFICATION_SUPPRESSION_SECONDS: ${{ inputs.notification_suppression_seconds }}

    steps:
      - name: Validate deployment environment
        shell: bash
        run: |
          set -euo pipefail
          case "${DEPLOY_ENV}" in
            dev|stg|prd) ;;
            *)
              echo "Unsupported deployment environment: ${DEPLOY_ENV}" >&2
              exit 1
              ;;
          esac

      - name: Validate deployment mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_LABEL: ${{ github.event.label.name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE:$CALLER_REPOSITORY" in
            compose:deg-labs/hdm|compose:deg-labs/volatility-monorepo|compose:deg-labs/stock-theme-ranking-bot|scheduled-container:deg-labs/jsf-taisyaku|package-update:deg-labs/gce-package-maintenance)
              if [[ "$EVENT_NAME" == pull_request && "$EVENT_LABEL" != "$DEPLOY_ENV" ]]; then
                echo 'PR label does not match the deployment environment.' >&2
                exit 1
              fi
              ;;
            *) echo 'Unsupported deployment mode or repository.' >&2; exit 1 ;;
          esac

      - name: Create GitHub App token
        id: app-token
        if: (inputs.enforce_deploy_team || inputs.checkout_submodules) && env.DEPLOY_APP_ID != '' && env.DEPLOY_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.DEPLOY_APP_ID }}
          private-key: ${{ env.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ inputs.checkout_submodules && steps.app-token.outputs.token || github.token }}
          submodules: ${{ inputs.checkout_submodules && 'recursive' || 'false' }}

      - name: Guard deploy actor is allowed member
        id: deploy-guard
        if: inputs.enforce_deploy_team
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPLOY_TEAM_SLUG: ${{ inputs.deploy_team_slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          TEAM_MEMBERS="$(gh api "orgs/${ORG_NAME}/teams/${DEPLOY_TEAM_SLUG}/members" --jq '.[].login')"
          if ! grep -Fxq "$DEPLOY_ACTOR" <<<"$TEAM_MEMBERS"; then
            echo "Actor '$DEPLOY_ACTOR' is not in ${ORG_NAME}/${DEPLOY_TEAM_SLUG}. Deployment is blocked." >&2
            exit 1
          fi

          # Dependabot PRs still require a team member to trigger deployment.
          if [[ -n "${PR_AUTHOR}" && "${PR_AUTHOR}" != 'dependabot[bot]' ]] && ! grep -Fxq "$PR_AUTHOR" <<<"$TEAM_MEMBERS"; then
            echo "PR author '$PR_AUTHOR' is not in ${ORG_NAME}/${DEPLOY_TEAM_SLUG} or the allowed bots. Deployment is blocked." >&2
            exit 1
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Validate required variables
        shell: bash
        run: |
          set -euo pipefail
          : "${GCE_INSTANCE_NAME:?GCE_INSTANCE_NAME is required}"
          : "${GCE_ZONE:?GCE_ZONE is required}"
          : "${GCP_SA_EMAIL:?GCP_SA_EMAIL is required}"
          : "${GCP_WIF_PROVIDER:?GCP_WIF_PROVIDER is required}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start non-production GCE instance and wait for SSH
        if: inputs.environment_name != 'prd'
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..60}; do
            instance_status="$(gcloud compute instances describe "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}" --format='value(status)')"
            if [[ "${instance_status}" == "RUNNING" ]]; then
              break
            fi

            if [[ "${instance_status}" == "TERMINATED" ]]; then
              gcloud compute instances start "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}"
            fi
            sleep 5
          done

          if [[ "${instance_status}" != "RUNNING" ]]; then
            echo "Timed out waiting for ${GCE_INSTANCE_NAME} to reach RUNNING state."
            exit 1
          fi

          for _ in {1..30}; do
            if gcloud compute ssh "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}" --command 'true' --quiet --ssh-flag='-o ConnectTimeout=5'; then
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for SSH on ${GCE_INSTANCE_NAME}."
          exit 1

      - name: Prepare managed application files
        if: inputs.deploy_mode == 'compose' || inputs.deploy_mode == 'scheduled-container'
        shell: bash
        run: |
          set -euo pipefail
          case "$CALLER_REPOSITORY" in
            deg-labs/volatility-monorepo)
              # shellcheck disable=SC2016
              sed -i 's/GOARCH=amd64/GOARCH="$(go env GOARCH)"/g' server/api/Dockerfile server/fetcher/Dockerfile
              printf '%s\n' "$APP_ENV" > .env
              ;;
            deg-labs/hdm|deg-labs/stock-theme-ranking-bot|deg-labs/jsf-taisyaku)
              if ! command -v envsubst >/dev/null; then
                sudo apt-get update
                sudo apt-get install -y gettext-base
              fi
              export DB_DIRECTORY='./data'
              # shellcheck disable=SC2016
              envsubst '$DEPLOY_ENV $DISCORD_WEBHOOK_URL $NOTIFICATION_SUPPRESSION_SECONDS $DB_DIRECTORY' < .env.template > .env
              if [[ "$CALLER_REPOSITORY" == deg-labs/hdm ]]; then
                printf '%s' "$ADDRESSES_TXT" > addresses.txt
              fi
              ;;
          esac

      - name: Pack and upload managed artifacts
        if: inputs.deploy_mode == 'compose' || inputs.deploy_mode == 'scheduled-container'
        shell: bash
        run: |
          set -euo pipefail
          tar_args=(--exclude=.git --exclude=.github --exclude=.env)
          case "$CALLER_REPOSITORY" in
            deg-labs/hdm) tar_args+=(--exclude=data) ;;
            deg-labs/volatility-monorepo) tar_args+=(--exclude=server/data --exclude=server/logs --exclude=client/ncmma/data --exclude=client/ncmma/logs --exclude=client/ncmma/cache) ;;
            deg-labs/stock-theme-ranking-bot) tar_args+=(--exclude=data --exclude=logs --exclude=__pycache__ --exclude=.pytest_cache) ;;
            deg-labs/jsf-taisyaku) tar_args+=(--exclude=__pycache__ --exclude=.claude --exclude=.devcontainer --exclude=.venv --exclude=tmp) ;;
          esac
          tar -C "$GITHUB_WORKSPACE" -czf /tmp/app.tar.gz "${tar_args[@]}" .
          gcloud compute scp /tmp/app.tar.gz .env "${GCE_INSTANCE_NAME}:~" --zone "$GCE_ZONE"

      - name: Deploy managed mode on GCE
        shell: bash
        run: |
          set -euo pipefail
          case "$CALLER_REPOSITORY" in
            deg-labs/hdm) app=hdm ;;
            deg-labs/volatility-monorepo) app=volatility-monorepo ;;
            deg-labs/stock-theme-ranking-bot) app=stock-theme-ranking-bot ;;
            deg-labs/jsf-taisyaku) app=jsf-taisyaku ;;
            deg-labs/gce-package-maintenance) app=package-maintenance ;;
            *) exit 1 ;;
          esac
          script=$(cat <<'REMOTE'
          set -euo pipefail
          if [[ "$1" == package-update ]]; then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get -o APT::Update::Error-Mode=any update
            sudo apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold upgrade
            sudo systemd-run --unit=gce-package-maintenance-reboot --on-active=60s /usr/bin/systemctl reboot
            exit 0
          fi
          target="/opt/apps/$2"
          sudo mkdir -p "$target"
          sudo chown -R "$(id -u):$(id -g)" "$target"
          tar -xzf ~/app.tar.gz -C "$target"
          mv -f ~/.env "$target/.env"
          cd "$target"
          sudo docker compose up -d --build --remove-orphans
          if [[ "$1" == scheduled-container ]]; then
            # Remove only the two legacy cron entries for this application.
            if command -v crontab >/dev/null; then
              cron=$(mktemp)
              cron_error=$(mktemp)
              if sudo env LC_ALL=C crontab -l > "$cron" 2> "$cron_error"; then
                awk '!/\/opt\/apps\/jsf-taisyaku/ && !/jsf-taisyaku\.log/' "$cron" | sudo crontab -
              elif ! grep -q '^no crontab for ' "$cron_error"; then
                cat "$cron_error" >&2
                exit 1
              fi
              rm -f "$cron" "$cron_error"
            fi
          fi
          REMOTE
          )
          encoded=$(printf '%s' "$script" | base64 -w 0)
          gcloud compute ssh "$GCE_INSTANCE_NAME" --zone "$GCE_ZONE" --command "echo '$encoded' | base64 -d | bash -s -- '$DEPLOY_MODE' '$app'"

      - name: Clean up remote artifact
        if: always()
        shell: bash
        run: gcloud compute ssh "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}" --command 'rm -f ~/app.tar.gz' || true
