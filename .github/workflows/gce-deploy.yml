name: Deploy application to GCE

on:
  workflow_call:
    inputs:
      checkout_submodules:
        description: Check out submodules recursively.
        required: false
        type: boolean
        default: false
      enforce_deploy_team:
        description: Require the actor (and PR author on pull_request) to belong to the configured organization team.
        required: false
        type: boolean
        default: true
      deploy_team_slug:
        description: Organization team allowed to deploy when enforcement is enabled.
        required: false
        type: string
        default: deg-develop
      environment_name:
        description: Deployment environment used by the actual deploy job.
        required: true
        type: string
      app_env_secret:
        description: Optional caller secret name whose value is exposed to prepare_command as APP_ENV.
        required: false
        type: string
        default: ''
      discord_webhook_secret:
        description: Optional caller secret name whose value is exposed to prepare_command as DISCORD_WEBHOOK_URL.
        required: false
        type: string
        default: ''
      addresses_secret:
        description: Optional caller secret name whose value is exposed to prepare_command as ADDRESSES_TXT.
        required: false
        type: string
        default: ''
      notification_suppression_seconds:
        description: Optional value exposed to prepare_command.
        required: false
        type: string
        default: '3600'
      deploy_server:
        description: Value exposed to remote_deploy_command for conditional server deployment.
        required: false
        type: boolean
        default: true
      deploy_client:
        description: Value exposed to remote_deploy_command for conditional client deployment.
        required: false
        type: boolean
        default: true
      prepare_command:
        description: Optional shell command executed before artifacts are created.
        required: false
        type: string
        default: ''
      artifact_excludes:
        description: Newline-delimited paths to omit from the application archive.
        required: false
        type: string
        default: ''
      additional_upload_files:
        description: Newline-delimited files to upload in addition to /tmp/app.tar.gz.
        required: false
        type: string
        default: ''
      remote_deploy_command:
        description: Shell command executed on the GCE instance after artifact upload.
        required: true
        type: string

jobs:
  deploy:
    # Caller workflows decide which labels are accepted for each repository.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       (github.event.label.name == 'dev' || github.event.label.name == 'stg' ||
        github.event.label.name == 'prd'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment_name }}
      # Environment-specific values use the DEV_*, STG_*, and PRD_* secret
      # prefixes. PROD_* remains a compatibility fallback for existing callers.
      GCE_INSTANCE_NAME: >-
        ${{
          secrets[format(
            '{0}_GCE_INSTANCE_NAME',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCE_INSTANCE_NAME || '')
        }}
      GCE_ZONE: >-
        ${{
          secrets[format(
            '{0}_GCE_ZONE',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] || secrets.GCE_ZONE ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCE_ZONE || '')
        }}
      GCP_SA_EMAIL: >-
        ${{
          secrets[format(
            '{0}_GCP_SA_EMAIL',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCP_SA_EMAIL || '')
        }}
      GCP_WIF_PROVIDER: >-
        ${{
          secrets[format(
            '{0}_GCP_WIF_PROVIDER',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCP_WIF_PROVIDER || '')
        }}
      APP_ENV: ${{ inputs.app_env_secret != '' && secrets[inputs.app_env_secret] || '' }}
      DISCORD_WEBHOOK_URL: ${{ inputs.discord_webhook_secret != '' && secrets[inputs.discord_webhook_secret] || '' }}
      ADDRESSES_TXT: ${{ inputs.addresses_secret != '' && secrets[inputs.addresses_secret] || '' }}
      DEPLOY_APP_ID: ${{ secrets.ORG_GH_APP_ID }}
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.ORG_GH_APP_PRIVATE_KEY }}
      NOTIFICATION_SUPPRESSION_SECONDS: ${{ inputs.notification_suppression_seconds }}
      DEPLOY_SERVER: ${{ inputs.deploy_server }}
      DEPLOY_CLIENT: ${{ inputs.deploy_client }}

    steps:
      - name: Validate deployment environment
        shell: bash
        run: |
          set -euo pipefail
          case "${DEPLOY_ENV}" in
            dev|stg|prd) ;;
            *)
              echo "Unsupported deployment environment: ${DEPLOY_ENV}" >&2
              exit 1
              ;;
          esac

      - name: Create GitHub App token
        id: app-token
        if: (inputs.enforce_deploy_team || inputs.checkout_submodules) && env.DEPLOY_APP_ID != '' && env.DEPLOY_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.DEPLOY_APP_ID }}
          private-key: ${{ env.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ inputs.checkout_submodules && steps.app-token.outputs.token || github.token }}
          submodules: ${{ inputs.checkout_submodules && 'recursive' || 'false' }}

      - name: Guard deploy actor is allowed member
        id: deploy-guard
        if: inputs.enforce_deploy_team
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPLOY_TEAM_SLUG: ${{ inputs.deploy_team_slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          TEAM_MEMBERS="$(gh api "orgs/${ORG_NAME}/teams/${DEPLOY_TEAM_SLUG}/members" --jq '.[].login')"
          if ! grep -Fxq "$DEPLOY_ACTOR" <<<"$TEAM_MEMBERS"; then
            echo "Actor '$DEPLOY_ACTOR' is not in ${ORG_NAME}/${DEPLOY_TEAM_SLUG}. Deployment is blocked."
            exit 1
          fi

          if [[ -n "${PR_AUTHOR}" ]] && ! grep -Fxq "$PR_AUTHOR" <<<"$TEAM_MEMBERS"; then
            echo "PR author '$PR_AUTHOR' is not in ${ORG_NAME}/${DEPLOY_TEAM_SLUG}. Deployment is blocked."
            exit 1
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Validate required variables
        shell: bash
        run: |
          set -euo pipefail
          : "${GCE_INSTANCE_NAME:?GCE_INSTANCE_NAME is required}"
          : "${GCE_ZONE:?GCE_ZONE is required}"
          : "${GCP_SA_EMAIL:?GCP_SA_EMAIL is required}"
          : "${GCP_WIF_PROVIDER:?GCP_WIF_PROVIDER is required}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start non-production GCE instance and wait for SSH
        if: inputs.environment_name != 'prd'
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..60}; do
            instance_status="$(gcloud compute instances describe "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}" --format='value(status)')"
            if [[ "${instance_status}" == "RUNNING" ]]; then
              break
            fi

            if [[ "${instance_status}" == "TERMINATED" ]]; then
              gcloud compute instances start "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}"
            fi
            sleep 5
          done

          if [[ "${instance_status}" != "RUNNING" ]]; then
            echo "Timed out waiting for ${GCE_INSTANCE_NAME} to reach RUNNING state."
            exit 1
          fi

          for _ in {1..30}; do
            if gcloud compute ssh "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}" --command 'true' --quiet --ssh-flag='-o ConnectTimeout=5'; then
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for SSH on ${GCE_INSTANCE_NAME}."
          exit 1

      - name: Prepare application files
        if: inputs.prepare_command != '' && (steps.deploy-guard.outputs.allowed == 'true' || inputs.enforce_deploy_team == false)
        shell: bash
        run: ${{ inputs.prepare_command }}

      - name: Pack and upload artifacts
        shell: bash
        run: |
          set -euo pipefail

          tar_args=(--exclude=.git --exclude=.github --exclude=.env)
          while IFS= read -r exclude; do
            [[ -n "${exclude}" ]] && tar_args+=("--exclude=${exclude}")
          done <<< "${{ inputs.artifact_excludes }}"
          tar -C "$GITHUB_WORKSPACE" -czf /tmp/app.tar.gz "${tar_args[@]}" .

          upload_files=(/tmp/app.tar.gz)
          while IFS= read -r file; do
            [[ -n "${file}" ]] && upload_files+=("${file}")
          done <<< "${{ inputs.additional_upload_files }}"
          gcloud compute scp "${upload_files[@]}" "${GCE_INSTANCE_NAME}:~" --zone "${GCE_ZONE}"

      - name: Deploy on GCE
        if: steps.deploy-guard.outputs.allowed == 'true' || inputs.enforce_deploy_team == false
        shell: bash
        env:
          REMOTE_DEPLOY_COMMAND: ${{ inputs.remote_deploy_command }}
        run: |
          set -euo pipefail
          printf -v remote_command "DEPLOY_SERVER='%s'\nDEPLOY_CLIENT='%s'\n%s\n" \
            "${{ inputs.deploy_server }}" \
            "${{ inputs.deploy_client }}" \
            "$REMOTE_DEPLOY_COMMAND"
          gcloud compute ssh "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}" --command "$remote_command"

      - name: Clean up remote artifact
        if: always()
        shell: bash
        run: gcloud compute ssh "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}" --command 'rm -f ~/app.tar.gz' || true
