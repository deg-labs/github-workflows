name: Deploy application to GCE

on:
  workflow_call:
    inputs:
      deploy_mode:
        description: compose または package-update を指定します。
        required: true
        type: string
      artifact_id:
        description: 同じ実行で作成された Compose 用成果物の ID です。
        type: string
        required: false
        default: ''
      runtime_env_secret:
        description: 実行時の dotenv または単一値を含む Secret 名です。
        type: string
        required: false
        default: ''
      runtime_env_key:
        description: 単一値を dotenv に変換する環境変数名です。省略時は Secret 全体を dotenv として扱います。
        type: string
        required: false
        default: ''
      runtime_file_secret:
        description: 実行時ファイルの内容を含む Secret 名です。
        type: string
        required: false
        default: ''
      runtime_file_name:
        description: 実行時ファイルの名前です。英数字、ピリオド、アンダースコア、ハイフンのみです。
        type: string
        required: false
        default: ''
      enforce_deploy_team:
        description: 実行者のチーム所属を必須にします。PR 作成者は同じチームのメンバーまたは dependabot[bot] を許可します。
        required: false
        type: boolean
        default: true
      deploy_team_slug:
        description: デプロイの実行を許可する Organization チームです。所属確認が有効な場合に使用します。
        required: false
        type: string
        default: deg-develop
      environment_name:
        description: 実際のデプロイジョブで使用するデプロイ環境です。
        required: true
        type: string

jobs:
  verify:
    if: inputs.deploy_mode == 'compose'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
    steps:
      - name: Check artifact ID
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v7
        with:
          repository: ${{ job['workflow_repository'] }}
          ref: ${{ job['workflow_sha'] }}
          path: shared
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: artifact
      - name: Validate artifact and Compose policy
        id: hash
        run: |
          set -euo pipefail
          python3 shared/scripts/validate_release.py artifact/deploy.tar.gz "$GITHUB_SHA"
          echo "digest=$(sha256sum artifact/deploy.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    if: |
      always() &&
      (inputs.deploy_mode == 'package-update' || needs.verify.result == 'success') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
        (github.event.label.name == 'dev' || github.event.label.name == 'stg' ||
         github.event.label.name == 'prd')))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment_name }}
      DEPLOY_MODE: ${{ inputs.deploy_mode }}
      CALLER_REPOSITORY: ${{ github.repository }}
      CALLER_NAME: ${{ github.event.repository.name }}
      # Environment-specific values use the DEV_*, STG_*, and PRD_* secret
      # prefixes. PROD_* remains a compatibility fallback for existing callers.
      GCE_INSTANCE_NAME: >-
        ${{
          secrets[format(
            '{0}_GCE_INSTANCE_NAME',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCE_INSTANCE_NAME || '')
        }}
      GCE_ZONE: >-
        ${{
          secrets[format(
            '{0}_GCE_ZONE',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] || secrets.GCE_ZONE ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCE_ZONE || '')
        }}
      GCP_SA_EMAIL: >-
        ${{
          secrets[format(
            '{0}_GCP_SA_EMAIL',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCP_SA_EMAIL || '')
        }}
      GCP_WIF_PROVIDER: >-
        ${{
          secrets[format(
            '{0}_GCP_WIF_PROVIDER',
            inputs.environment_name == 'dev' && 'DEV' ||
            inputs.environment_name == 'stg' && 'STG' ||
            'PRD'
          )] ||
          (inputs.environment_name == 'prd' && secrets.PROD_GCP_WIF_PROVIDER || '')
        }}
      RUNTIME_ENV: ${{ inputs.runtime_env_secret != '' && secrets[inputs.runtime_env_secret] || '' }}
      RUNTIME_FILE: ${{ inputs.runtime_file_secret != '' && secrets[inputs.runtime_file_secret] || '' }}
      DEPLOY_APP_ID: ${{ secrets.ORG_GH_APP_ID }}
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.ORG_GH_APP_PRIVATE_KEY }}

    steps:
      - name: Validate deployment environment
        shell: bash
        run: |
          set -euo pipefail
          case "${DEPLOY_ENV}" in
            dev|stg|prd) ;;
            *)
              echo "Unsupported deployment environment: ${DEPLOY_ENV}" >&2
              exit 1
              ;;
          esac

      - name: Validate deployment mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_LABEL: ${{ github.event.label.name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE" in
            compose|package-update) ;;
            *) echo 'Unsupported deployment mode.' >&2; exit 1 ;;
          esac
          if [[ "$EVENT_NAME" == pull_request && "$EVENT_LABEL" != "$DEPLOY_ENV" ]]; then
            echo 'PR label does not match the deployment environment.' >&2
            exit 1
          fi
          [[ "$CALLER_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || { echo 'Invalid repository name.' >&2; exit 1; }

      - name: Create GitHub App token
        id: app-token
        if: inputs.enforce_deploy_team && env.DEPLOY_APP_ID != '' && env.DEPLOY_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.DEPLOY_APP_ID }}
          private-key: ${{ env.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout shared workflow scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ job['workflow_repository'] }}
          ref: ${{ job['workflow_sha'] }}
          path: shared
          persist-credentials: false

      - name: Guard deploy actor is allowed member
        id: deploy-guard
        if: inputs.enforce_deploy_team
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPLOY_TEAM_SLUG: ${{ inputs.deploy_team_slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          TEAM_MEMBERS="$(gh api "orgs/${ORG_NAME}/teams/${DEPLOY_TEAM_SLUG}/members" --jq '.[].login')"
          if ! grep -Fxq "$DEPLOY_ACTOR" <<<"$TEAM_MEMBERS"; then
            echo "Actor '$DEPLOY_ACTOR' is not in ${ORG_NAME}/${DEPLOY_TEAM_SLUG}. Deployment is blocked." >&2
            exit 1
          fi

          # Dependabot PRs still require a team member to trigger deployment.
          if [[ -n "${PR_AUTHOR}" && "${PR_AUTHOR}" != 'dependabot[bot]' ]] && ! grep -Fxq "$PR_AUTHOR" <<<"$TEAM_MEMBERS"; then
            echo "PR author '$PR_AUTHOR' is not in ${ORG_NAME}/${DEPLOY_TEAM_SLUG} or the allowed bots. Deployment is blocked." >&2
            exit 1
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Validate required variables
        shell: bash
        run: |
          set -euo pipefail
          : "${GCE_INSTANCE_NAME:?GCE_INSTANCE_NAME is required}"
          : "${GCE_ZONE:?GCE_ZONE is required}"
          : "${GCP_SA_EMAIL:?GCP_SA_EMAIL is required}"
          : "${GCP_WIF_PROVIDER:?GCP_WIF_PROVIDER is required}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start non-production GCE instance and wait for SSH
        if: inputs.environment_name != 'prd'
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..60}; do
            instance_status="$(gcloud compute instances describe "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}" --format='value(status)')"
            if [[ "${instance_status}" == "RUNNING" ]]; then
              break
            fi

            if [[ "${instance_status}" == "TERMINATED" ]]; then
              gcloud compute instances start "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}"
            fi
            sleep 5
          done

          if [[ "${instance_status}" != "RUNNING" ]]; then
            echo "Timed out waiting for ${GCE_INSTANCE_NAME} to reach RUNNING state."
            exit 1
          fi

          for _ in {1..30}; do
            if gcloud compute ssh "${GCE_INSTANCE_NAME}" --zone "${GCE_ZONE}" --command 'true' --quiet --ssh-flag='-o ConnectTimeout=5'; then
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for SSH on ${GCE_INSTANCE_NAME}."
          exit 1

      - name: Download validated artifact
        if: inputs.deploy_mode == 'compose'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: artifact

      - name: Deploy on GCE
        env:
          EXPECTED_DIGEST: ${{ needs.verify.outputs.digest }}
          RUNTIME_ENV_KEY: ${{ inputs.runtime_env_key }}
          RUNTIME_ENV_SECRET_NAME: ${{ inputs.runtime_env_secret }}
          RUNTIME_FILE_NAME: ${{ inputs.runtime_file_name }}
          RUNTIME_FILE_SECRET_NAME: ${{ inputs.runtime_file_secret }}
        shell: bash
        run: |
          set -euo pipefail
          app="${CALLER_NAME,,}"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          prefix="gce-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          work="$RUNNER_TEMP/$prefix"
          mkdir -m 700 "$work"
          cp shared/scripts/deploy_remote.sh "$work/$prefix-script.sh"
          files=("$work/$prefix-script.sh")
          if [[ -n "$RUNTIME_FILE_NAME$RUNTIME_FILE_SECRET_NAME" ]]; then
            [[ "$DEPLOY_MODE" == compose && -n "$RUNTIME_FILE_SECRET_NAME" && -n "$RUNTIME_FILE" && "$RUNTIME_FILE_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
          fi
          if [[ "$DEPLOY_MODE" == compose ]]; then
            [[ "$(sha256sum artifact/deploy.tar.gz | cut -d ' ' -f 1)" == "$EXPECTED_DIGEST" ]]
            if [[ -n "$RUNTIME_ENV_SECRET_NAME" && -z "$RUNTIME_ENV" ]]; then
              echo 'Runtime environment secret is empty or unavailable.' >&2
              exit 1
            fi
            umask 077
            if [[ -n "$RUNTIME_ENV_KEY" ]]; then
              [[ "$RUNTIME_ENV_KEY" =~ ^[A-Z_][A-Z0-9_]*$ && "$RUNTIME_ENV" != *$'\n'* && "$RUNTIME_ENV" != *$'\r'* ]]
              printf '%s=%s\n' "$RUNTIME_ENV_KEY" "$RUNTIME_ENV" > "$work/$prefix-env"
            else
              printf '%s\n' "$RUNTIME_ENV" > "$work/$prefix-env"
            fi
            printf 'DEPLOY_ENV=%s\n' "$DEPLOY_ENV" >> "$work/$prefix-env"
            cp artifact/deploy.tar.gz "$work/$prefix-archive.tgz"
            files+=("$work/$prefix-archive.tgz" "$work/$prefix-env")
            if [[ -n "$RUNTIME_FILE_NAME" ]]; then
              printf '%s' "$RUNTIME_FILE" > "$work/$prefix-file"
              files+=("$work/$prefix-file")
            fi
          fi
          gcloud compute scp "${files[@]}" "${GCE_INSTANCE_NAME}:~" --zone "$GCE_ZONE"
          gcloud compute ssh "$GCE_INSTANCE_NAME" --zone "$GCE_ZONE" --command "bash ~/$prefix-script.sh '$DEPLOY_MODE' '$app' '$RUNTIME_FILE_NAME' '$prefix'"

      - name: Clean up remote files
        if: always() && steps.auth.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          prefix="gce-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "$GCE_INSTANCE_NAME" --zone "$GCE_ZONE" --command "rm -f ~/$prefix-script.sh ~/$prefix-archive.tgz ~/$prefix-env ~/$prefix-file" || true
